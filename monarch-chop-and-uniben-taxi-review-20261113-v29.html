<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONARCH · Chop & Ride Review</title><style>*{box-sizing:border-box}body{margin:0;font:600 18px system-ui;color:#24314a;background:linear-gradient(140deg,#fff9dd,#e4f6ff,#f5e8fa)}main{padding:16px;max-width:650px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:8px 0 12px}h2{font-size:24px}small,p{font-weight:450}.hold{font-size:11px;border:1px solid #d5a945;padding:7px;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{font:700 19px system-ui;border:0;border-radius:22px;padding:20px 9px;min-height:116px;color:#23314b;background:#ffdb80;cursor:pointer}button:nth-child(2n){background:#b3e7ff}button:nth-child(3n){background:#b9ebd2}button:nth-child(4n){background:#f8c5df}button:nth-child(5n){background:#c9c7ff}button:nth-child(6n){background:#ffd0b2}.back{min-height:46px;padding:10px 18px;background:white;border:1px solid #b6c5d3;font-size:16px}.panel{background:white;border:1px solid #bdcbd9;border-radius:20px;padding:18px;margin-top:16px}label{display:block;margin:15px 0 6px}input,select{width:100%;padding:15px;font:18px system-ui;border:1px solid #a7b4c7;border-radius:13px}.wide{width:100%;margin-top:14px}.hide{display:none}.note{font-size:13px;font-weight:450;margin-top:16px}#screen{min-height:65vh}</style><main><header><h1>👑 MONARCH</h1><span class="hold">REVIEW · HOLD</span></header><section id="screen"><h2>Wetin you wan do?</h2><div id="buttons" class="grid"></div><div id="form" class="panel hide"></div></section><p class="note">Synthetic customer preview. No real sellers, drivers, bookings, fares, payments or dispatch. CROWN HOLD.</p></main><script>
const buttons=document.getElementById('buttons'),form=document.getElementById('form');let stage=0,mode='',food='',ride='',order='',pickup='',destination='',chosenArea='';const home=['🔎 Find Anything','🛒 Buy Something','🛠️ Book Service','🛵 Send Something','📍 Choose Location','🎙️ Talk to Osayi'];const foodOptions=['🍲 Mama Put','🍢 Suya','🥯 Akara & Bread','🍛 Restaurants','🍗 Fast Food','🍱 Facebook/TikTok Food Vendors','🎉 Party Catering','🍽️ Other Food'];const rideOptions=['🚕 Taxi','🚗 Private Car','🛵 Okada (where lawful)','🚌 Bus','🚐 Group Ride','🚙 Other Transport'];function screen(title,items,fn){form.classList.add('hide');document.querySelector('#screen h2').textContent=title;buttons.replaceChildren();items.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>fn(x,i);buttons.append(b)});if(stage){const b=document.createElement('button');b.className='back wide';b.textContent='⬅️ Back Home';b.onclick=homeScreen;buttons.after(b);document.querySelectorAll('.back.wide').forEach((e,i)=>{if(i>0)e.remove()})}else document.querySelectorAll('.back.wide').forEach(e=>e.remove())}function homeScreen(){stage=0;screen('Wetin you wan do?',home,(x,i)=>{stage=1;if(i===5){screen('Osayi Help — Demo', ['🗣️ I wan chop food and order taxi go UNIBEN','📝 Explain my need'],()=>startCombo());return}screen('Wetin you need?', ['🍲 I Wan Chop Food','🚕 I Need Taxi','🍲🚕 Chop Food + Taxi Go UNIBEN','👷 Find Worker','🏠 Find House','🛒 Buy Anything'],(x,j)=>{if(j===2)startCombo();else if(j===0)startFood(false);else if(j===1)startRide(false);else screen('More options dey come', ['🍲🚕 Plan Food + Taxi'],startCombo)})})}function startCombo(){mode='combo';stage=2;screen('How you wan arrange am?', ['🍲 Chop First, Taxi Later','🚕 Taxi First, Chop Later','🛵 Deliver Food, Taxi Carry Me','🗺️ Compare Food and Taxi Together'],x=>{order=x;startFood(true)})}function startFood(combo){stage=3;screen('Wetin you wan chop?',foodOptions,x=>{food=x;screen('Where you wan buy food?', ['📍 Around My Area','🌍 Anywhere for Benin','📱 Facebook/TikTok Vendor','🔎 I Get Particular Seller'],y=>{chosenArea=y;if(combo)startRide(true);else details()})})}function startRide(combo){stage=4;screen('Which transport you want?',rideOptions,x=>{ride=x;screen('Where you wan go?', ['🎓 UNIBEN Ugbowo Campus','🏫 UNIBEN Ekehuan Campus','📍 Another Place'],y=>{destination=y;details()})})}function details(){stage=5;buttons.replaceChildren();document.querySelector('#screen h2').textContent='Confirm your choices';form.classList.remove('hide');form.replaceChildren();const summary=document.createElement('p');summary.textContent=[order,food,chosenArea,ride,destination].filter(Boolean).join(' · ');form.append(summary);[['pickup','Where you dey now?','e.g. Ring Road, Benin'],['destination','Where exactly you wan go?','e.g. UNIBEN main gate'],['note','Any special instruction?','e.g. no pepper; taxi after food']].forEach(([id,l,placeholder])=>{let label=document.createElement('label');label.textContent=l;label.htmlFor=id;let input=document.createElement('input');input.id=id;input.placeholder=placeholder;if(id==='destination')input.value=destination;form.append(label,input)});const b=document.createElement('button');b.className='wide';b.textContent='📋 Review My Plan (No Booking)';b.onclick=()=>{const p=document.createElement('div');p.className='panel';p.textContent='DRAFT ONLY — '+[order,food,ride,document.getElementById('pickup').value,document.getElementById('destination').value].filter(Boolean).join(' · ')+' . Seller prices, availability and taxi fare UNKNOWN. Nothing sent or booked.';form.replaceChildren(p);let back=document.createElement('button');back.className='wide';back.textContent='🏠 Start Again';back.onclick=()=>{food=ride=order=destination=chosenArea='';homeScreen()};form.append(back)};form.append(b)}homeScreen();
</script></html>
