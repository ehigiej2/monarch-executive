<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONARCH Nigeria — Customer Review v5</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(130deg,#fff9e3,#e6f6ff,#f7eaff);color:#20314d;font:600 18px system-ui}main{max-width:720px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:27px}.hold{font-size:12px;border:1px solid #d7ac44;border-radius:24px;padding:8px}h2{font-size:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:0;border-radius:22px;padding:12px;min-height:clamp(116px,19dvh,175px);font:700 19px system-ui;color:#20314d;cursor:pointer;box-shadow:0 3px 0 #0001}.tile:nth-child(6n+1){background:#ffdc83}.tile:nth-child(6n+2){background:#b6e8ff}.tile:nth-child(6n+3){background:#b7eccc}.tile:nth-child(6n+4){background:#f8c8e0}.tile:nth-child(6n+5){background:#cfcbff}.tile:nth-child(6n){background:#ffd1b5}.tile:focus-visible{outline:3px solid #123e8c}.back,.action{border:1px solid #aebcd0;background:white;border-radius:14px;padding:14px;font:700 17px system-ui;margin:5px 8px 12px 0}.panel{background:white;border:1px solid #aebcd0;border-radius:18px;padding:16px;margin:12px 0}.panel p{font-weight:400}textarea,select{width:100%;padding:13px;font:18px system-ui;border:1px solid #aebcd0;border-radius:12px}.note{font-size:12px;font-weight:400;line-height:1.5}.err{background:#ffe7e7;padding:12px;border-radius:12px}</style><main><header><h1>👑 MONARCH</h1><span class="hold">REVIEW · HOLD</span></header><h2 id="title">Wetin you wan do?</h2><div id="nav"></div><div id="grid" class="grid"><button class="tile" data-home="0">🔎 Find Anything</button><button class="tile" data-home="1">🛒 Buy Something</button><button class="tile" data-home="2">🛠️ Book a Service</button><button class="tile" data-home="3">🛵 Send Something</button><button class="tile" data-home="4">📍 Choose Location</button><button class="tile" data-home="5">🎙️ Talk to Osayi</button></div><div id="extra"></div><p class="note">Fictional test only · No real suppliers, school runs, legal advice, tickets, orders or payments · CROWN HOLD.</p></main><script>
(function(){
'use strict';
var sectors={'🍲 Food & Chop':['Akara','Mama Put','Suya','Catering','Restaurant','Supermarket','Bakery','Bulk Yam'],'🚕 Waka & Tickets':['Taxi','Share Ride','Add Stops','School Waka','Bus Ticket','Flight Ticket','Cargo','Courier'],'🏗️ Trades & Materials':['Renovation','Building Materials','Mechanic','Spare Parts','Carpenter','Welder','Borehole','Water Tanker'],'🎓 School & Mentors':['School Runs','Parent Support','Find Mentor','School Resources','Research','Skills Training','Diaspora Experts','School Admin'],'🌾 Farms & Animals':['Farm Produce','Cooperative','Bulk Orders','Farm Logistics','Vet','Puppies','Animal Feed','Equipment'],'💼 Work & Professionals':['Post Work','Apply for Work','Lawyer','Immigration Lawyer','Barber','Tailor','Accountant','House Help'],'🌍 Travel & Visas':['Student Visa','Work Visa','Visit Visa','Family Visa','Hotels','Airport Taxi','Travel Package','Visa Documents'],'🏠 Home & Lifestyle':['Rent House','Buy House','Property Inspection','Beauty & Spa','Live Band','Event Planning','Fuel','Diaspora Project']};
var areas=['Benin City','Ugbowo','Aduwawa','Ring Road','Sapele Road','Lagos','Abuja','Anywhere for Nigeria'];
var state={page:'home',sector:'',service:'',area:'Benin City',plan:[],notes:''};var history=[];
var title=document.getElementById('title'),grid=document.getElementById('grid'),nav=document.getElementById('nav'),extra=document.getElementById('extra');
function node(tag,text,cls){var n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function btn(text,fn,cls){var b=node('button',text,cls||'tile');b.type='button';b.addEventListener('click',fn);return b}
function show(page){state.page=page;title.textContent=page==='home'?'Wetin you wan do?':page==='sectors'?'Wetin you dey find?':page==='services'?state.sector:page==='actions'?'Wetin you wan do with '+state.service+'?':page==='location'?'Choose where you wan buy':page==='details'?'Tell us wetin you need':page==='plan'?'My Connected Plan':page==='review'?'Review My Plan':'Talk to Osayi';grid.replaceChildren();nav.replaceChildren();extra.replaceChildren();if(history.length)nav.append(btn('⬅️ Go Back',back,'back'));
if(page==='home'){['🔎 Find Anything','🛒 Buy Something','🛠️ Book a Service','🛵 Send Something','📍 Choose Location','🎙️ Talk to Osayi'].forEach(function(x,i){grid.append(btn(x,function(){forward(i===4?'location':i===5?'osayi':'sectors')}))})}
if(page==='sectors')Object.keys(sectors).forEach(function(x){grid.append(btn(x,function(){state.sector=x;forward('services')}))});
if(page==='services')sectors[state.sector].forEach(function(x){grid.append(btn(x,function(){state.service=x;forward('actions')}))});
if(page==='actions')['🔎 Explore Options','⚖️ Compare Choices','📍 Choose Area','🧩 Add Another Need','📝 Describe My Need','👥 Check Providers'].forEach(function(x,i){grid.append(btn(x,function(){forward(i===2?'location':i===3?'sectors':'details')}))});
if(page==='location'){var p=node('div',undefined,'panel'),s=node('select');areas.forEach(function(x){var o=node('option',x);o.value=x;s.append(o)});s.value=state.area;s.addEventListener('change',function(){state.area=s.value});p.append(s,node('p','Na your choice, even if seller dey far. Real delivery cost UNKNOWN.'),btn('✅ Keep My Location',back,'action'));extra.append(p)}
if(page==='osayi'){extra.append(node('p','Osayi voice never connect for this test. You fit use the buttons to explore.'));extra.append(btn('🔎 Explore Services',function(){forward('sectors')},'action'))}
if(page==='details'){var p=node('div',undefined,'panel'),t=node('textarea');t.rows=3;t.placeholder='Example: I need catering and taxi go UNIBEN';t.value=state.notes;t.addEventListener('input',function(){state.notes=t.value});p.append(node('p',state.service+' · '+state.area),t,btn('➕ Add to My Plan',function(){state.plan.push({service:state.service,sector:state.sector,area:state.area,notes:state.notes});state.notes='';forward('plan')},'action'));extra.append(p)}
if(page==='plan'){var p=node('div',undefined,'panel');state.plan.forEach(function(x,i){var r=node('div',undefined,'panel');r.append(node('strong',x.service+' · '+x.area),node('p',x.notes||'No notes yet'),btn('❌ Remove',function(){state.plan.splice(i,1);show('plan')},'action'));p.append(r)});p.append(btn('🧩 Add Another Service',function(){forward('sectors')},'action'),btn('📋 Review Plan',function(){forward('review')},'action'));extra.append(p)}
if(page==='review'){var p=node('div',undefined,'panel');state.plan.forEach(function(x){p.append(node('p',x.service+' · '+x.area))});p.append(node('p','No real order sent. Supplier, price, ticket, availability and delivery UNKNOWN.'),btn('⬅️ Edit My Plan',function(){forward('plan')},'action'));extra.append(p)}
}
function forward(page){history.push(state.page);show(page)}function back(){show(history.pop()||'home')}
window.addEventListener('error',function(e){var p=node('p','Page error: '+e.message,'err');extra.append(p)});
show('home');
})();
</script></html>
