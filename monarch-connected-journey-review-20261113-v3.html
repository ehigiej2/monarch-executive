<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MONARCH Journey Review</title><style>body{font:600 18px system-ui;background:linear-gradient(140deg,#fff7d9,#e4f5ff,#f5eaff);color:#20324b;margin:0}main{max-width:650px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px}.hold{font-size:12px;border:1px solid #d4aa42;border-radius:20px;padding:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{border:0;border-radius:20px;padding:15px;font:700 18px system-ui;color:#20324b;cursor:pointer;min-height:115px}.grid button:nth-child(6n+1){background:#ffdb81}.grid button:nth-child(6n+2){background:#b4e7ff}.grid button:nth-child(6n+3){background:#b5edce}.grid button:nth-child(6n+4){background:#f5c4dd}.grid button:nth-child(6n+5){background:#cac9ff}.grid button:nth-child(6n){background:#ffd1af}.back,.small{background:white;border:1px solid #a9b8c9;min-height:48px;margin:8px 0}.panel{background:#fff;border:1px solid #b9cadb;border-radius:16px;padding:16px;margin:14px 0}label{display:block;margin:14px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;font:18px system-ui;padding:12px;border:1px solid #abbdd0;border-radius:10px;margin-top:6px}.full{width:100%;min-height:65px;background:#ffdb81}.note{font-size:12px;font-weight:400;line-height:1.5}</style><main><header><h1>👑 MONARCH</h1><span class="hold">REVIEW · HOLD</span></header><div id="app"></div><p class="note">Fictional journey simulation only. No real prices, suppliers, tickets, applications, school records, bookings or payments. CROWN HOLD.</p></main><script>
const sectors={'🍲 Food & Restaurants':['Akara','Mama Put','Suya','Catering','Restaurants','Supermarket','Bakery','Bulk Yam'],'🚕 Transport & Tickets':['Taxi','Share Ride','Add Stop','School Waka','Bus Ticket','Flight Ticket','Cargo','Courier'],'🏗️ Building & Trades':['Renovation','Cement','Mechanic','Spare Parts','Carpenter','Welder','Borehole','Water Tanker'],'🎓 Schools & Mentoring':['Find Mentor','Student Help','School Resources','School Runs','Research','Skills','Diaspora Experts','School Admin'],'🌾 Farms & Animals':['Farm Produce','Cooperative','Bulk Orders','Farm Logistics','Vet','Puppies','Animal Feed','Equipment'],'💼 Work & Professional':['Post Work','Apply for Work','Legal Advice','Immigration Lawyer','Barber','Tailor','Accountant','House Help'],'🌍 Travel & Visas':['Student Visa','Work Visa','Visit Visa','Family Visa','Hotels','Airport Taxi','Travel Package','Visa Documents'],'🏠 Homes & Lifestyle':['Rent House','Buy House','Property Inspection','Beauty & Spa','Live Band','Event Planning','Fuel','Diaspora Project']};
const app=document.getElementById('app');let stack=[],state={sector:'',service:'',area:'Benin City',notes:'',plan:[]};const areas=['Benin City','Ugbowo','Aduwawa','Ring Road','Sapele Road','Lagos','Abuja','Anywhere in Nigeria'];function el(t,text,cl){let n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cl)n.className=cl;return n}function button(text,fn,cl){let b=el('button',text,cl);b.onclick=fn;return b}function screen(title,items,fn){app.replaceChildren();if(stack.length)app.append(button('⬅️ Back',()=>{let p=stack.pop();p()},'back'));app.append(el('h2',title));let g=el('div',undefined,'grid');items.forEach((x,i)=>g.append(button(x,()=>fn(x,i))));app.append(g)}function go(fn){stack.push(current);current=fn;fn()}let current=home;function home(){screen('Wetin you wan do?',['🔎 Find Anything','🛒 Buy Something','🛠️ Book a Service','🛵 Send Something','📍 Choose Location','🎙️ Talk to Osayi'],(x,i)=>{if(i===4)go(location);else if(i===5)go(osayi);else go(categories)})}function categories(){screen('Which kind thing you need?',Object.keys(sectors),x=>{state.sector=x;go(services)})}function services(){screen(state.sector,sectors[state.sector],x=>{state.service=x;go(actions)})}function actions(){screen('Wetin you wan do for '+state.service+'?',['🔎 Explore Choices','⚖️ Compare Options','📍 Choose Area','🧩 Add Another Service','📝 Describe My Need','👥 Find Eligible Provider'],(x,i)=>{if(i===2)go(location);else if(i===3)go(categories);else go(details)})}function location(){app.replaceChildren();app.append(button('⬅️ Back',()=>stack.pop()(),'back'),el('h2','Choose where you wan buy from'));let p=el('div',undefined,'panel');let s=el('select');areas.forEach(a=>{let o=el('option',a);o.value=a;s.append(o)});s.value=state.area;s.onchange=()=>state.area=s.value;p.append(s,el('p','Na your choice, even if seller far. Delivery price and live availability still UNKNOWN.'));p.append(button('✅ Keep Location',()=>stack.pop()(),'full'));app.append(p)}function osayi(){app.replaceChildren();app.append(button('⬅️ Back',()=>stack.pop()(),'back'),el('h2','🎙️ Talk to Osayi'));let p=el('div',undefined,'panel');p.append(el('p','Live voice no connect for this review. You fit explore the service buttons.'));p.append(button('🔎 Explore Services',()=>go(categories),'full'));app.append(p)}function details(){app.replaceChildren();app.append(button('⬅️ Back',()=>stack.pop()(),'back'),el('h2',state.service+' — Tell us small'));let p=el('div',undefined,'panel');p.append(el('p','No real provider or price confirmed. Describe your need before review.'));let l=el('label','Wetin exactly you need?');let t=el('textarea');t.rows=3;t.value=state.notes;t.oninput=()=>state.notes=t.value;l.append(t);let a=el('label','Where?'),s=el('select');areas.forEach(x=>{let o=el('option',x);o.value=x;s.append(o)});s.value=state.area;s.onchange=()=>state.area=s.value;a.append(s);p.append(l,a,button('➕ Add to My Plan',()=>{state.plan.push({sector:state.sector,service:state.service,area:state.area,notes:state.notes});state.notes='';go(plan)},'full'));app.append(p)}function plan(){app.replaceChildren();app.append(button('⬅️ Back',()=>stack.pop()(),'back'),el('h2','My Connected Plan'));let p=el('div',undefined,'panel');state.plan.forEach((x,i)=>{let r=el('div',undefined,'panel');r.append(el('strong',x.service+' · '+x.area),el('p',x.notes||'Details to confirm'));r.append(button('❌ Remove',()=>{state.plan.splice(i,1);plan()},'small'));p.append(r)});p.append(button('🧩 Add Another Service',()=>go(categories),'full'),button('📋 Review My Plan',()=>go(review),'full'));app.append(p)}function review(){app.replaceChildren();app.append(button('⬅️ Back',()=>stack.pop()(),'back'),el('h2','Review Only — No Order Sent'));let p=el('div',undefined,'panel');state.plan.forEach(x=>p.append(el('p',x.service+' · '+x.area)));p.append(el('p','Live suppliers: UNKNOWN · Prices: UNKNOWN · Delivery: UNKNOWN · Permissions: UNKNOWN.'));p.append(button('⬅️ Edit My Plan',()=>go(plan),'full'));app.append(p)}home();</script></html>
